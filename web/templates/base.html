<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>{% block title %}RTI Sahayak{% endblock %}</title>
<meta name="description" content="{% block meta_description %}Draft a Right to Information Act, 2005 application with AI assistance - grounded in the Act's actual text, with section-level citations, and honest when it can't confidently help.{% endblock %}"/>
<meta property="og:type" content="website"/>
<meta property="og:title" content="{% block og_title %}RTI Sahayak{% endblock %}"/>
<meta property="og:description" content="{% block og_description %}Draft a Right to Information Act, 2005 application with AI assistance - grounded in the Act's actual text, with section-level citations.{% endblock %}"/>
<meta property="og:url" content="{{ request.url }}"/>
<link href="/static/favicon.svg" rel="icon" type="image/svg+xml"/>
<link href="/static/vendor/tailwind.css" rel="stylesheet"/>
<link href="/static/vendor/fonts.css" rel="stylesheet"/>
<style>
    .cite { font-family:"JetBrains Mono",monospace; font-size:.75rem;
      padding:.05rem .4rem; margin:0 .15rem; border:1px solid #924c00;
      border-radius:999px; color:#924c00; white-space:nowrap; cursor:pointer; }
    :lang(hi), :lang(mr), .devanagari { font-family:"Noto Sans Devanagari",sans-serif; }

    /* Component classes below, ported from each screen's <head><style> block in
       design/stitch_rti_sahayak_ai_assistant/*/code.html. Verbatim per screen -
       not deduplicated across near-duplicate names (e.g. .paper-shadow vs
       .shadow-ambient vs .ai-input-shadow are the same rule under different
       names in different screens; .flat-card vs .card-flat likewise). Three
       classes were found defined differently by two screens each and were
       deliberately left out - see the task report for .statutory-line,
       .btn-primary, .btn-secondary. Per-screen "body { ... }" resets were also
       left out - they conflict with each other and with the bg-background
       already on <body> in this file. */

    /* rounded-DEFAULT is a literal class name the design source uses, but
       Tailwind only ever generates the bare .rounded class for a "DEFAULT"
       scale key - it never generates rounded-DEFAULT itself. Value copied
       from theme.extend.borderRadius.DEFAULT in web/tailwind.config.js. */
    .rounded-DEFAULT { border-radius: 0.25rem; }

    /* draft_application_desktop */
    .custom-scrollbar::-webkit-scrollbar { width: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #E3DDD2; border-radius: 10px; }
    /* .form-input-flat and .form-label-mono moved to web/tailwind.input.css,
       inside a components layer, so the compiler actually processes their
       Tailwind-composed rules; see that file. */
    .paper-shadow {
        box-shadow: 0 4px 20px rgba(18, 33, 46, 0.08);
    }
    .amber-button {
        background-color: #C6742A;
        color: #ffffff;
    }
    .amber-button:hover {
        background-color: #a86224;
    }
    .secondary-button {
        border: 1px solid #12212E;
        color: #12212E;
        background-color: transparent;
    }
    .secondary-button:hover {
        background-color: #F7F4EE;
    }

    /* home_screen_desktop */
    .ai-input-shadow {
        box-shadow: 0 4px 20px rgba(18, 33, 46, 0.08);
    }

    /* home_screen_mobile */
    .card-flat {
        background-color: #FFFFFF;
        border: 1px solid #E3DDD2;
        border-radius: 12px;
        box-shadow: none;
    }
    .shadow-ambient {
        box-shadow: 0 4px 20px rgba(18, 33, 46, 0.08);
    }
    .hide-scrollbar::-webkit-scrollbar {
        display: none;
    }
    .hide-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
    }
    .input-base {
        background-color: #FFFFFF;
        border: 1px solid #E3DDD2;
        border-radius: 8px;
    }
    .input-base:focus {
        border-color: #12212E;
        outline: none;
        box-shadow: none;
    }

    /* system_telemetry_modal */
    .modal-overlay {
        background-color: rgba(18, 33, 46, 0.4);
        backdrop-filter: blur(2px);
    }
    .grid-bg-pattern {
        background-image:
            linear-gradient(to right, #E3DDD2 1px, transparent 1px),
            linear-gradient(to bottom, #E3DDD2 1px, transparent 1px);
        background-size: 24px 24px;
        opacity: 0.5;
    }

    /* track_application_desktop */
    .flat-card {
        background-color: #FFFFFF;
        border: 1px solid #E3DDD2;
        border-radius: 12px;
        box-shadow: none;
    }
    .status-tag-amber {
        background-color: #F7F4EE;
        border: 1px solid #C6742A;
        color: #C6742A;
        border-radius: 9999px;
        padding: 4px 12px;
    }

    /* browse_the_act_desktop */
    /* Named .statutory-line-browse, not .statutory-line - this screen and
       track_application_desktop each define .statutory-line differently, so
       the bare name was deliberately left out (see the .statutory-line entry
       in the note above). This is this screen's own version only. */
    .statutory-line-browse {
        border-left: 2px solid #0E4D45;
        padding-left: 16px;
        margin-left: 4px;
    }

    /* answer_screen_desktop */
    .amber-bg { background-color: #C6742A; }
    .amber-text { color: #C6742A; }
    .amber-border { border-color: #C6742A; }
    .statutory-border { border-left-color: #0E4D45; }
    .cursor-blink { animation: blink 1s step-end infinite; }
    @keyframes blink { 50% { opacity: 0; } }

    /* Account control in every nav (partials/account_nav.html). Plain CSS,
       like the rest of this block, so it needs no Tailwind rebuild. */
    .acct-link { padding: 6px 12px; margin-left: 8px; color: #00352f; font-weight: 600; border-radius: 999px; white-space: nowrap; transition: background .2s; }
    .acct-link:hover { background: #edeeec; }
    .acct-cta { padding: 8px 16px; border-radius: 999px; color: #fff !important; font-weight: 600; white-space: nowrap;
      background: linear-gradient(135deg, #0e4d45, #00352f); box-shadow: 0 6px 18px -6px rgba(14,77,69,.6); transition: transform .2s, box-shadow .2s; }
    .acct-cta:hover { transform: translateY(-1px); box-shadow: 0 10px 24px -8px rgba(14,77,69,.7); }
    .acct-menu { position: relative; margin-left: 12px; }
    .acct-menu summary { list-style: none; cursor: pointer; }
    .acct-menu summary::-webkit-details-marker { display: none; }
    .acct-avatar { display: grid; place-items: center; width: 36px; height: 36px; border-radius: 50%; color: #fff; font-weight: 700;
      background: linear-gradient(135deg, #C6742A, #0e4d45); box-shadow: 0 0 0 3px #fff, 0 0 0 4px #E3DDD2; }
    .acct-pop { position: absolute; right: 0; top: calc(100% + 10px); min-width: 220px; padding: 14px; background: #fff;
      border: 1px solid #E3DDD2; border-radius: 14px; box-shadow: 0 18px 40px -12px rgba(18,33,46,.25); z-index: 60; }
    .acct-pop-name { font-weight: 700; color: #12212E; }
    .acct-pop-mail { font-size: .8rem; color: #404946; margin-bottom: 10px; word-break: break-all; }
    .acct-pop-link { display: block; padding: 8px 10px; margin: 0 -4px 8px; border-radius: 10px; color: #00352f; font-weight: 600; }
    .acct-pop-link:hover { background: #f2f4f2; }
    .acct-pop button { width: 100%; padding: 8px; border-radius: 10px; border: 1px solid #E3DDD2; color: #93000a; font-weight: 600; }
    .acct-pop button:hover { background: #ffdad6; }
    .acct-mobile { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 12px 16px; border-top: 1px solid #E3DDD2; }
    .acct-ghost { padding: 8px 16px; border-radius: 999px; border: 1px solid #bfc8c5; color: #00352f; font-weight: 600; }
    .acct-hello { flex: 1; color: #404946; }
    /* Make room for the account control on mid-size screens. */
    @media (max-width: 1439px) { header [data-i18n="nav.tagline"], nav [data-i18n="nav.tagline"] { display: none !important; } }

    /* Site-wide polish: gentle entrance and hover lift on existing cards/buttons. */
    main { animation: page-in .5s cubic-bezier(.2,.7,.2,1) both; }
    @keyframes page-in { from { opacity: 0; transform: translateY(8px); } }
    .flat-card, .card-flat { transition: transform .25s, box-shadow .25s; }
    .flat-card:hover, .card-flat:hover { transform: translateY(-2px); box-shadow: 0 14px 30px -18px rgba(18,33,46,.35); }
    .amber-button { transition: transform .2s, box-shadow .2s, background-color .2s; }
    .amber-button:hover { transform: translateY(-1px); box-shadow: 0 10px 22px -10px rgba(198,116,42,.8); }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
{% block head_extra %}{% endblock %}
</head>
<body class="bg-background">
{% block nav %}{% endblock %}
{% block content %}{% endblock %}
{% block scripts %}{% endblock %}
<script src="/static/js/i18n.js"></script>
<script src="/static/js/backup.js"></script>
</body>
</html>
