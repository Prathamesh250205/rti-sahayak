{# Password + confirm with strength meter - shared by signup and reset in auth.html. #}
<div class="field"><label for="password">Password</label>
<div class="field-box"><span class="material-symbols-outlined">lock</span>
<input id="password" name="password" type="password" autocomplete="new-password" required minlength="8" placeholder="At least 8 characters"/>
<button class="peek" type="button" aria-label="Show password"><span class="material-symbols-outlined">visibility</span></button></div>
<div class="meter" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
<p class="meter-label" aria-live="polite"></p></div>
<div class="field"><label for="confirm">Confirm password</label>
<div class="field-box"><span class="material-symbols-outlined">lock_reset</span>
<input id="confirm" name="confirm" type="password" autocomplete="new-password" required minlength="8" placeholder="Re-enter password"/>
<button class="peek" type="button" aria-label="Show password"><span class="material-symbols-outlined">visibility</span></button></div></div>
