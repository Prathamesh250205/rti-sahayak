services:
  - type: web
    name: rti-sahayak
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt && python -m rag.ingest
    startCommand: uvicorn web.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: LLM_PROVIDER
        sync: false
      # Deliberately NOT anthropic-first here, unlike local dev during the
      # Gate 13 investigation: Anthropic is paid with no daily cap, and this
      # is a public deployment - anthropic-first would mean every visitor's
      # request bills the owner, all the time, not just during a quota
      # crunch. Groq's free tier (1,000 RPD, resets daily) is plenty for a
      # demo; Anthropic sits second so a Groq throttle always has somewhere
      # to land instead of becoming a visible failure, without being the
      # provider paying for every normal request. Not a secret (provider
      # names only), so it's a plain value here rather than sync: false.
      - key: LLM_PROVIDER_CHAIN
        value: groq,anthropic,gemini
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
