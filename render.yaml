services:
  - type: web
    name: rti-sahayak
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt && python -m rag.ingest
    startCommand: uvicorn web.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: LLM_PROVIDER
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
