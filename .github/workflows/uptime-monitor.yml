name: Uptime monitor

# Availability monitoring for the deployed instance - not a keep-alive.
# Finds out the deployed site is broken before someone reading the resume
# does. Checks GET /healthz for HTTP 200 and the expected chunk count.
#
# Set the site to check under repo Settings > Secrets and variables >
# Actions > Variables as SITE_URL (e.g. https://rti-sahayak.vercel.app).
# Until it's set, the job skips instead of failing.
#
# Scheduled 09:00-22:00 IST only. GitHub Actions cron runs in UTC
# (IST = UTC+5:30), so the window is 03:30-16:30 UTC:
#   - "30 3 * * *"       -> 03:30 UTC  = 09:00 IST
#   - "0,30 4-16 * * *"  -> 04:00-16:30 UTC = 09:30-22:00 IST
on:
  schedule:
    - cron: "30 3 * * *"
    - cron: "0,30 4-16 * * *"
  workflow_dispatch: {}

jobs:
  check-healthz:
    runs-on: ubuntu-latest
    if: vars.SITE_URL != ''
    steps:
      - name: GET /healthz and verify 200 + 83 chunks
        run: |
          set -e
          # -m 90: a cold Vercel function loads the embedding model and
          # copies the Chroma index on first request - give it room so an
          # ordinary cold start isn't reported as an outage.
          response=$(curl -s -w "\n%{http_code}" -m 90 "${{ vars.SITE_URL }}/healthz")
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')

          echo "HTTP status: $http_code"
          echo "Response body: $body"

          if [ "$http_code" != "200" ]; then
            echo "::error::/healthz returned HTTP $http_code, expected 200"
            exit 1
          fi

          chunk_count=$(echo "$body" | grep -o '"chroma_chunk_count":[0-9]*' | grep -o '[0-9]*$')

          if [ "$chunk_count" != "83" ]; then
            echo "::error::chroma_chunk_count=${chunk_count:-<missing>}, expected 83"
            exit 1
          fi

          echo "OK: /healthz returned 200 with 83 chunks"
